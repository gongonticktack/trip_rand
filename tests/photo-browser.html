<!doctype html><html lang="ja"><meta charset="utf-8"><title>Trip Rand 写真処理テスト</title><h1>写真処理テスト</h1><button id="run">写真処理をテスト</button><pre id="result"></pre><script type="module">
import {photoJpeg} from '../lib/photos.mjs';
document.getElementById('run').onclick=async()=>{const result=document.getElementById('result');try{const canvas=document.createElement('canvas');canvas.width=2000;canvas.height=1000;canvas.getContext('2d').fillRect(0,0,2000,1000);const png=await new Promise(r=>canvas.toBlob(r,'image/png'));const jpeg=await photoJpeg(new File([png],'test.png',{type:'image/png'}));const bitmap=await createImageBitmap(jpeg);if(jpeg.type!=='image/jpeg'||bitmap.width!==1600||bitmap.height!==800||jpeg.size>5242880)throw Error('resize failed');bitmap.close();for(const file of [new File(['unsupported'],'fake.heic',{type:'image/heic'}),new File([new Uint8Array(20*1024*1024+1)],'large.jpg',{type:'image/jpeg'})]){let rejected=false;try{await photoJpeg(file);}catch{rejected=true;}if(!rejected)throw Error('invalid file accepted');}result.textContent='PASS: PNG→JPEG、2000×1000→1600×800、容量制限、非対応形式の拒否';}catch(e){result.textContent='FAIL: '+e.message;}};
</script></html>
